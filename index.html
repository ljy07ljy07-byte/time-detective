<style>
/* Layout idea: a detective's casebook. Story first, pattern second, name last. One column, cards stacked, tense color carries meaning. */
:root {
  --ink: #1b2340;
  --muted: #5a6382;
  --paper: #f3f5fa;
  --card: #ffffff;
  --line: #dde2ee;
  --accent: #1b2340;
  --good: #16794c;
  --bad: #c2362f;
  --good-bg: #e6f5ec;
  --bad-bg: #fbe9e7;
  --pres: #2f6fd6; --prog: #1f9d6b; --past: #d9711a; --fut: #8a4fd3; --pp: #d02a6b; --pastpf: #0e7490;
  --display: "Bricolage Grotesque", "Segoe UI", system-ui, sans-serif;
  --body: "Atkinson Hyperlegible", "Segoe UI", system-ui, sans-serif;
  color-scheme: light;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --ink: #e8ebf6; --muted: #a3abc6; --paper: #11152a; --card: #1a2038; --line: #2c3456; --accent: #e8ebf6;
    --good: #5fd39a; --bad: #ff8a80; --good-bg: #173a2a; --bad-bg: #42201f;
    --pres: #6ea0ff; --prog: #4fd1a0; --past: #ffa24d; --fut: #b98cff; --pp: #ff6fa8; --pastpf: #46c4e0;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --ink: #e8ebf6; --muted: #a3abc6; --paper: #11152a; --card: #1a2038; --line: #2c3456; --accent: #e8ebf6;
  --good: #5fd39a; --bad: #ff8a80; --good-bg: #173a2a; --bad-bg: #42201f;
  --pres: #6ea0ff; --prog: #4fd1a0; --past: #ffa24d; --fut: #b98cff; --pp: #ff6fa8; --pastpf: #46c4e0;
  color-scheme: dark;
}
* { box-sizing: border-box; }
html, body { margin: 0; }
body { background: var(--paper); color: var(--ink); font-family: var(--body); font-size: 17px; line-height: 1.6; }
.wrap { max-width: 760px; margin: 0 auto; padding: 20px 16px 64px; display: grid; gap: 18px; }
h1, h2, h3 { font-family: var(--display); line-height: 1.15; margin: 0; text-wrap: balance; }
h1 { font-size: 34px; font-weight: 800; letter-spacing: -.01em; }
h2 { font-size: 24px; font-weight: 800; }
h3 { font-size: 18px; font-weight: 600; }
p { margin: 0; }
button { font: inherit; color: inherit; cursor: pointer; }
button:focus-visible, select:focus-visible, a:focus-visible { outline: 3px solid var(--tc, var(--pres)); outline-offset: 2px; }
.muted { color: var(--muted); }
.zh { display: none; color: var(--muted); font-size: 15px; }
body.show-zh .zh { display: block; }
body.show-zh span.zh { display: inline; }

/* top bar */
.top { display: flex; align-items: center; justify-content: space-between; gap: 12px; flex-wrap: wrap; }
.brand { display: flex; align-items: center; gap: 10px; }
.brand svg { width: 34px; height: 34px; }
.brand b { font-family: var(--display); font-size: 20px; font-weight: 800; }
.toggles { display: flex; gap: 8px; flex-wrap: wrap; }
.chip-btn { border: 1.5px solid var(--line); background: var(--card); border-radius: 999px; padding: 6px 14px; font-size: 14px; }
.chip-btn[aria-pressed="true"] { border-color: var(--ink); background: var(--ink); color: var(--paper); }

/* home */
.hero { display: grid; gap: 8px; }
.hero p { max-width: 62ch; }
.how { display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px; }
.how div { background: var(--card); border: 1px solid var(--line); border-radius: 12px; padding: 10px 12px; font-size: 14.5px; }
.how b { display: block; font-family: var(--display); font-size: 15px; }
.chapters { display: grid; gap: 10px; }
.chap { display: grid; grid-template-columns: 54px 1fr auto; gap: 14px; align-items: center; text-align: left; width: 100%;
  background: var(--card); border: 1px solid var(--line); border-left: 6px solid var(--tc); border-radius: 14px; padding: 12px 14px; }
.chap:hover { border-color: var(--tc); }
.chap .no { font-family: var(--display); font-weight: 800; font-size: 26px; color: var(--tc); text-align: center; }
.chap .t { font-family: var(--display); font-weight: 600; font-size: 18px; }
.chap .s { font-size: 14.5px; color: var(--muted); }
.stars { font-size: 18px; letter-spacing: 2px; color: #e3a008; white-space: nowrap; }
.stars .off { color: var(--line); }
.row-btns { display: flex; gap: 10px; flex-wrap: wrap; }
.big-btn { border: none; background: var(--ink); color: var(--paper); border-radius: 12px; padding: 12px 18px; font-weight: 700; }
.ghost-btn { border: 1.5px solid var(--line); background: var(--card); border-radius: 12px; padding: 10px 16px; font-weight: 700; }
.parent { background: var(--card); border: 1px dashed var(--muted); border-radius: 14px; padding: 14px 16px; display: grid; gap: 6px; font-size: 15.5px; }
.parent ul { margin: 0; padding-left: 20px; }

/* chapter */
.chead { display: grid; gap: 6px; }
.crumbs { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; }
.back { border: none; background: none; padding: 0; color: var(--muted); font-weight: 700; }
.tag { background: var(--tc); color: #fff; border-radius: 999px; padding: 2px 10px; font-size: 13px; font-weight: 700; }
.steps { display: flex; gap: 6px; flex-wrap: wrap; }
.steps { flex-wrap: nowrap; }
.steps span { flex: 1 1 0; min-width: 0; height: 6px; border-radius: 3px; background: var(--line); }
.steps span.done { background: var(--tc); }
.steps span.now { background: var(--tc); opacity: .45; }
.card { background: var(--card); border: 1px solid var(--line); border-radius: 16px; padding: 18px; display: grid; gap: 14px; }
.step-label { font-size: 13px; font-weight: 700; letter-spacing: .08em; text-transform: uppercase; color: var(--tc); }
.story { font-size: 19px; line-height: 1.85; }
.story .w { border-radius: 6px; padding: 1px 2px; }
.story.read .t-verb { font-weight: 700; color: var(--tc); }
.story.spot .w { cursor: pointer; }
.story.spot .w:hover { background: color-mix(in srgb, var(--tc) 12%, transparent); }
.story .found { background: var(--tc); color: #fff; }
.story .miss { background: var(--bad-bg); color: var(--bad); }
.counter { font-weight: 700; color: var(--tc); }
.listen { display: inline-flex; align-items: center; gap: 8px; border: 1.5px solid var(--tc); color: var(--tc); background: none; border-radius: 999px; padding: 6px 14px; font-weight: 700; font-size: 15px; }
.listen svg { width: 16px; height: 16px; }
.opts { display: grid; gap: 10px; }
.opt { text-align: left; width: 100%; background: var(--card); border: 2px solid var(--line); border-radius: 12px; padding: 12px 14px; display: flex; gap: 10px; align-items: center; }
.opt:hover:not(:disabled) { border-color: var(--tc); }
.opt:disabled { cursor: default; }
.opt.right { border-color: var(--good); background: var(--good-bg); }
.opt.wrong { border-color: var(--bad); background: var(--bad-bg); }
.opt .k { flex: none; width: 28px; height: 28px; border-radius: 8px; display: grid; place-items: center; background: var(--paper); font-weight: 700; font-size: 14px; }
.opt svg { width: 100%; max-width: 300px; height: auto; }
.opt-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
.feedback { border-radius: 12px; padding: 12px 14px; font-size: 16px; }
.feedback.good { background: var(--good-bg); color: var(--good); }
.feedback.bad { background: var(--bad-bg); color: var(--bad); }
.feedback b { display: block; }
.feedback .why { color: var(--ink); margin-top: 2px; }
.qcount { font-size: 14px; color: var(--muted); font-weight: 700; }
.prompt { font-size: 20px; line-height: 1.5; }
.blank { display: inline-block; min-width: 90px; border-bottom: 2.5px solid var(--tc); text-align: center; color: var(--tc); font-weight: 700; }
.wordline { display: flex; flex-wrap: wrap; gap: 6px; font-size: 20px; }
.wordline button { border: 2px solid var(--line); background: var(--card); border-radius: 10px; padding: 4px 10px; }
.wordline button:hover:not(:disabled) { border-color: var(--tc); }
.wordline button.bad { border-color: var(--bad); background: var(--bad-bg); }
.wordline button.hit { border-color: var(--tc); background: var(--tc); color: #fff; }
.rule { border: 2px solid var(--tc); border-radius: 14px; overflow: hidden; }
.rule-h { background: var(--tc); color: #fff; padding: 8px 14px; display: flex; justify-content: space-between; gap: 10px; flex-wrap: wrap; font-family: var(--display); font-weight: 600; }
.rule-b { padding: 12px 14px; display: grid; gap: 10px; }
.rule-b svg { width: 100%; height: auto; max-height: 120px; }
.rule-row { display: grid; grid-template-columns: 92px 1fr; gap: 10px; font-size: 16px; }
.rule-row em { font-style: normal; font-size: 13px; font-weight: 700; color: var(--tc); text-transform: uppercase; letter-spacing: .06em; padding-top: 3px; }
.next { justify-self: end; }
.done-card { text-align: center; justify-items: center; }
.done-card .stars { font-size: 34px; }
/* briefing */
.bt { width: 100%; border-collapse: collapse; font-size: 16px; }
.bt th, .bt td { border: 1px solid var(--line); padding: 7px 9px; text-align: left; vertical-align: top; }
.bt th { background: color-mix(in srgb, var(--tc) 12%, transparent); font-size: 14px; }
.bt small { color: var(--muted); }
.chain { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; font-size: 17px; margin: 6px 0; }
.chain span { background: var(--paper); border: 1px solid var(--line); border-radius: 10px; padding: 5px 10px; }
.chain span + span::before { content: "→ "; color: var(--muted); }
.vs { display: grid; grid-template-columns: 1fr 1fr; gap: 6px 14px; font-size: 16.5px; margin: 6px 0; }
.vs small { color: var(--muted); }
.mk { font-weight: 800; margin-right: 4px; } .mk.ok { color: var(--good); } .mk.no { color: var(--bad); }
.irr { display: flex; flex-wrap: wrap; gap: 6px; } .irr span { background: var(--paper); border: 1px solid var(--line); border-radius: 8px; padding: 3px 9px; }
.bblock h3 { font-family: var(--display); font-size: 18px; margin: 0 0 6px; color: var(--tc); }
.bblock p { margin: 4px 0; }
.bblock u { text-decoration-color: var(--tc); text-decoration-thickness: 3px; }
.worked { border: 2px dashed var(--tc); border-radius: 14px; padding: 14px; display: grid; gap: 8px; }
.worked ol { margin: 0; padding-left: 22px; display: grid; gap: 6px; }
.unit-row { display: grid; grid-template-columns: 1fr auto; gap: 10px; align-items: center; }
.chap.brief { border-style: dashed; }
@media (max-width: 560px) { .vs { grid-template-columns: 1fr; } }
/* boss */
.report { font-size: 18.5px; line-height: 2.1; }
.report select { font: inherit; font-size: 16px; border: 2px solid var(--line); border-radius: 8px; padding: 2px 4px; background: var(--card); color: var(--ink); max-width: 100%; }
.report select.right { border-color: var(--good); background: var(--good-bg); }
.report select.wrong { border-color: var(--bad); background: var(--bad-bg); }
.report sup { color: var(--muted); font-weight: 700; margin-right: 2px; }
.whys { display: grid; gap: 8px; font-size: 15.5px; }
.whys div { border-left: 4px solid var(--line); padding-left: 10px; }
.whys div.ok { border-color: var(--good); }
.whys div.no { border-color: var(--bad); }
.casebook { display: grid; gap: 14px; }
@media (max-width: 560px) {
  .how { grid-template-columns: 1fr 1fr; }
  .opt-grid { grid-template-columns: 1fr; }
  h1 { font-size: 28px; }
  .story { font-size: 18px; }
  .rule-row { grid-template-columns: 1fr; gap: 0; }
}
/* grammar story player (added) */
.player { display: grid; gap: 12px; width: 100%; }
.ptabs { display: flex; gap: 6px; flex-wrap: wrap; justify-content: center; }
.ptabs button { border: 2px solid var(--tc); background: var(--card); color: var(--tc); border-radius: 999px; padding: 5px 14px; font-weight: 800; }
.ptabs button.on { background: var(--tc); color: #fff; }
.pstage { position: relative; display: grid; gap: 14px; background: color-mix(in srgb, var(--tc) 7%, var(--card)); border: 2px dashed color-mix(in srgb, var(--tc) 35%, var(--line)); border-radius: 18px; padding: 14px 12px 22px; overflow: hidden; }
.ps-top { display: flex; gap: 10px; align-items: flex-end; }
.ps-cast { display: flex; align-items: flex-end; flex: none; position: relative; }
.ps-prop { font-size: 34px; margin-left: -6px; }
.ps-say { flex: 1; font-size: 17px; } .ps-say p:first-child { font-weight: 600; }
.psent { font-family: var(--display); font-size: 34px; font-weight: 700; line-height: 1.3; text-align: center; padding-top: 34px; }
.mw { display: inline-block; white-space: nowrap; }
.mw.new { color: #fff; background: var(--tc); border-radius: 10px; padding: 0 8px; font-weight: 800; }
.subj { position: relative; display: inline-block; }
.sb { position: absolute; left: 50%; top: -30px; transform: translateX(-50%); font-family: var(--body); font-size: 13px; font-weight: 800; white-space: nowrap; border-radius: 999px; padding: 1px 9px; }
.sb.one { background: #e3a008; color: #fff; box-shadow: 0 0 0 4px color-mix(in srgb, #e3a008 30%, transparent); }
.sb.many { background: var(--muted); color: #fff; }
.suf { display: inline-block; }
.suf.in { color: #fff; background: #e3a008; border-radius: 10px; padding: 0 5px; margin-left: 2px; font-weight: 800; box-shadow: 0 4px 0 #b07800; }
.suf.in.swap { background: var(--tc); box-shadow: 0 4px 0 color-mix(in srgb, var(--tc) 60%, #000); }
.suf.out, .mw.gone { color: var(--bad); background: var(--bad-bg); border-radius: 8px; text-decoration: line-through; overflow: hidden; vertical-align: bottom; }
.pctl { display: flex; gap: 8px; align-items: center; justify-content: center; flex-wrap: wrap; }
.pbtn { border: 2px solid var(--line); background: var(--card); border-radius: 12px; min-width: 44px; height: 42px; font-weight: 800; padding: 0 12px; }
.pbtn.next { background: var(--tc); color: #fff; border-color: var(--tc); font-size: 17px; padding: 0 20px; }
.pbtn.next.done { background: var(--card); color: var(--tc); }
.pdots { display: flex; gap: 5px; } .pdots span { width: 10px; height: 10px; border-radius: 50%; background: var(--line); } .pdots span.on { background: var(--tc); transform: scale(1.3); } .pdots span.past { background: color-mix(in srgb, var(--tc) 45%, var(--line)); }
.anim-btn { border: 2px solid rgba(255,255,255,.8); background: rgba(255,255,255,.15); color: #fff; border-radius: 18px; padding: 10px 16px; font-weight: 800; font-size: 17px; margin-top: 6px; }
.anim-btn small { display: block; font-size: 13.5px; opacity: .9; }
@media (max-width: 560px) { .psent { font-size: 25px; } .ps-top { flex-direction: column; align-items: stretch; } .ps-cast { justify-content: center; } .ps-cast .av { width: 56px; height: 65px; } }
@media (prefers-reduced-motion: no-preference) {
  .ps-say { animation: bubble .45s both; }
  .sb { animation: badge 1s .3s both; }
  @keyframes badge { 0% { opacity: 0; transform: translate(-50%, -30px) scale(3); } 50% { opacity: 1; transform: translate(-50%, 0) scale(.8); } 70% { transform: translate(-50%, 0) scale(1.2); } 100% { transform: translate(-50%, 0) scale(1); } }
  .sb.one { animation: badge 1s .3s both, spot 1.2s 1.3s ease-in-out 2; }
  @keyframes spot { 50% { box-shadow: 0 0 0 12px color-mix(in srgb, #e3a008 25%, transparent); } }
  /* exaggerated: endings fly in from far above, spinning, huge, then BOING */
  .suf.in { animation: superfly 1.3s calc(1.2s + var(--d, 0s)) cubic-bezier(.2,1.5,.4,1) both; }
  @keyframes superfly {
    0% { opacity: 0; transform: translate(160px, -260px) rotate(-720deg) scale(5); }
    55% { opacity: 1; transform: translate(0, 0) rotate(0) scale(1.6, .6); }
    70% { transform: translateY(-26px) scale(.85, 1.25); }
    85% { transform: translateY(0) scale(1.2, .85); }
    100% { transform: none; } }
  /* endings fly off: wobble in fear, then get launched away */
  .suf.out, .mw.gone { animation: launch 1.5s .5s ease-in forwards; }
  @keyframes launch {
    0% { max-width: 8em; transform: none; }
    15% { transform: rotate(-12deg) scale(1.3); } 25% { transform: rotate(12deg) scale(1.3); } 35% { transform: rotate(-12deg) scale(1.3); opacity: 1; max-width: 8em; }
    100% { opacity: 0; transform: translate(-180px, -320px) rotate(-900deg) scale(3); max-width: 0; padding: 0; } }
  .mw.new { animation: drop2 1.1s 1s cubic-bezier(.25,1.6,.45,1) both; }
  @keyframes drop2 { 0% { opacity: 0; transform: translateY(-240px) scale(2.5) rotate(15deg); } 60% { opacity: 1; transform: translateY(0) scale(1.3, .7); } 80% { transform: scale(.9, 1.15); } 100% { transform: none; } }
  .shake2 { animation: shake2 .45s; } @keyframes shake2 { 20% { transform: translate(-6px, 3px); } 40% { transform: translate(6px, -3px); } 60% { transform: translate(-4px, 2px); } 80% { transform: translate(3px, -1px); } }
  .ps-cast .av { animation: bob 1.8s ease-in-out infinite; } .ps-prop { animation: hop 1.2s ease-in-out infinite; display: inline-block; }
}
@media (prefers-reduced-motion: reduce) { .suf.out, .mw.gone { display: none; } }
/* beat-by-beat sequence (added): one thing moves at a time */
.beats { display: flex; gap: 6px; justify-content: center; }
.beats span { width: 34px; height: 34px; border-radius: 50%; display: grid; place-items: center; font-size: 17px; background: var(--card); border: 2px solid var(--line); filter: grayscale(1); opacity: .45; }
.ps-cast { position: relative; display: flex; justify-content: center; align-items: flex-end; padding-top: 50px; min-height: 140px; }
.ps-cast .av { width: 84px; height: 98px; }
.ps-sym { position: absolute; top: 0; left: 50%; transform: translateX(-50%); display: flex; gap: 6px; }
.sy { font-size: 22px; font-weight: 800; border-radius: 999px; padding: 2px 14px; white-space: nowrap; background: var(--card); border: 3px solid var(--line); }
.sy.one { border-color: #e3a008; color: #b07800; background: #fff6dc; }
.sy.many { border-color: var(--muted); color: var(--ink); }
.sy.prop { font-size: 26px; padding: 0 10px; }
.ps-cap { text-align: center; display: grid; gap: 2px; } .ps-cap b { font-size: 22px; color: var(--tc); } .ps-cap span { color: var(--muted); font-size: 15px; font-weight: 600; }
.psent { padding-top: 30px; }
@media (prefers-reduced-motion: no-preference) {
  /* beat timing: 0s cast · 1.2s symbol · 2.4s sentence · 3.6s off · 4.8s in · 6s caption (no "off" beat → everything after moves 1.2s earlier) */
  .pstage { --t3: 2.4s; --t4: 3.6s; --t5: 4.8s; --t6: 6.2s; }
  .pstage.no-out { --t5: 3.6s; --t6: 5s; }
  .beats span { animation: beaton .4s calc(var(--b) * 1.2s) both; }
  @keyframes beaton { from { filter: grayscale(1); opacity: .45; } to { filter: none; opacity: 1; border-color: var(--tc); transform: scale(1.15); } }
  .ps-cast .av { animation: castin .7s cubic-bezier(.3,1.5,.5,1) both, bob 1.8s 1s ease-in-out infinite; }
  .ps-cast .av + .av { animation-delay: .25s, 1.2s; }
  @keyframes castin { from { opacity: 0; transform: translateY(40px) scale(.5); } }
  .ps-sym { animation: symup 1s 1.2s cubic-bezier(.3,1.6,.5,1) both; }
  @keyframes symup { 0% { opacity: 0; transform: translate(-50%, 70px) scale(.3); } 70% { opacity: 1; transform: translate(-50%, -8px) scale(1.25); } 100% { transform: translate(-50%, 0) scale(1); } }
  .sy.one { animation: spot 1.2s 2.2s ease-in-out 2; }
  .psent { animation: sentin .7s var(--t3) both; } @keyframes sentin { from { opacity: 0; transform: translateY(20px); } }
  .sb { animation: badge 1s var(--t3) both; }
  .sb.one { animation: badge 1s var(--t3) both; }
  .suf.out, .mw.gone { animation: launch 1.5s var(--t4) ease-in forwards; }
  .suf.in { animation: superfly 1.3s calc(var(--t5) + var(--d, 0s)) cubic-bezier(.2,1.5,.4,1) both; }
  .mw.new { animation: drop2 1.1s var(--t5) cubic-bezier(.25,1.6,.45,1) both; }
  .mw.new .suf.in { animation-delay: calc(var(--t5) + .4s + var(--d, 0s)); }
  .ps-cap { animation: sentin .6s var(--t6) both; }

/* subject → pronoun → group → verb chain (added) */

  prog:   { when: 'Right now, at this moment', zh: '現在正在做', shape: 'am / is / are + verb<u>ing</u>', shapeZh: 'be 動詞 + 動詞 ing', ex: ['Look! Theo <b>is running</b>.', 'We <b>are not sleeping</b>.'] },
  past:   { when: 'Finished in the past', zh: '過去發生、已經結束', shape: 'verb<u>ed</u> · or went, saw, found…', shapeZh: '動詞加 ed，或不規則變化', ex: ['Nora <b>found</b> a key yesterday.', '<b>Did</b> you <b>see</b> it?'] },
  fut:    { when: 'Later, in the future', zh: '之後才會發生', shape: '<u>will</u> + verb', shapeZh: 'will + 原形動詞', ex: ['I <b>will help</b> you tomorrow.', 'It <b>won’t rain</b> tonight.'] },
  pp:     { when: 'From the past up to now', zh: '從過去連到現在（經驗、持續）', shape: '<u>have / has</u> + gone, seen, done…', shapeZh: 'have / has + 過去分詞', ex: ['I <b>have</b> never <b>seen</b> a ghost.', 'He <b>has worked</b> here <b>for</b> 40 years.'] },
  pastpf: { when: 'Before another past moment', zh: '過去的「更早之前」', shape: '<u>had</u> + gone, seen, done…', shapeZh: 'had + 過去分詞', ex: ['When we arrived, the clock <b>had</b> already <b>stopped</b>.', 'She <b>had left</b> before the dance.'] },
};
function keyCard(ch) {
  const K = KEYS[ch.id];
  return `<div class="keycard" style="--tc:${color(ch.id)}"><div class="kc-h">🔑 ${ch.name} <span>${ch.zh}</span></div>
    ${animTL(ch.id)}<div class="kc-row"><b>${K.shape}</b><span>${K.zh}</span></div>
    <div class="kc-ex">${K.ex.map(e => `<div>${e}</div>`).join('')}</div></div>`;
}

function ruleCard(ch) {
  return `<div class="rule" style="--tc:${color(ch.id)}"><div class="rule-h"><span>${ch.name}</span><span class="zh" style="color:#fff">${ch.zh}　${ch.lessons}</span></div>
    <div class="rule-b">${timeline(ch.id, 320)}
      <div class="rule-row"><em>Use it for</em><span>${ch.rule.use}</span></div>
      <div class="rule-row"><em>Shape</em><span><b>${ch.rule.form}</b></span></div>
      <div class="rule-row"><em>Not / ?</em><span>${ch.rule.neg}</span></div>
      <div class="rule-row"><em>Example</em><span><i>${ch.rule.ex}</i></span></div>
      <p class="zh">${ch.rule.zh}</p></div></div>`;
}

function topBar() {
  return `<div class="top"><button class="back brand" data-go="home" aria-label="Home">
      <svg viewBox="0 0 40 40" aria-hidden="true"><circle cx="17" cy="17" r="11" fill="none" stroke="var(--ink)" stroke-width="3.5"/><line x1="25" y1="25" x2="35" y2="35" stroke="var(--ink)" stroke-width="4" stroke-linecap="round"/><line x1="17" y1="17" x2="17" y2="10" stroke="var(--pp)" stroke-width="2.5" stroke-linecap="round"/><line x1="17" y1="17" x2="22" y2="19" stroke="var(--pp)" stroke-width="2.5" stroke-linecap="round"/></svg>
      <b>Time Detective</b></button>
    <div class="toggles"><span class="chip-btn" title="Total stars">⭐ ${totalStars()}</span><button class="chip-btn" id="voiceBtn" aria-label="Reading voice">🔊</button><button class="chip-btn" data-go="casebook">Casebook</button><button class="chip-btn" id="zhBtn" aria-pressed="${!!S.zh}">中文對照</button></div></div>`;
}
function wire(root) {
  root.querySelectorAll('[data-go]').forEach(b => b.addEventListener('click', () => go(b.dataset.go)));
  const vb = root.querySelector('#voiceBtn'); if (vb) vb.addEventListener('click', voicePanel);
  const z = root.querySelector('#zhBtn');
  if (z) z.addEventListener('click', () => { S.zh = !S.zh; save(); document.body.classList.toggle('show-zh', S.zh); z.setAttribute('aria-pressed', S.zh); });
}

// ───────── Views ─────────
function go(where) {
  try { window.speechSynthesis && speechSynthesis.cancel(); } catch (e) {}
  musicStop();
  location.hash = where === 'home' ? '' : where;
  render();
  window.scrollTo(0, 0);
}
window.addEventListener('hashchange', render);

function render() {
  const id = location.hash.slice(1);
  if (id === 'casebook') return casebook();
  if (id === 'case-report') return boss();
  const m = id.match(/^([a-z]+)(?:-(brief|anim|L[1-4]|[123]))?$/);
  const ch = m && CH.find(c => c.id === m[1]);
  if (ch && !m[2]) return unit(ch);
  if (ch && m[2] === 'brief') return briefing(ch);
  if (ch && m[2] === 'anim') return animPage(ch);
  if (ch && /^L\d$/.test(m[2])) return lessonPage(ch, +m[2].slice(1));
  if (ch) return chapter(ch, +m[2]);
  home();
}

// what should the child do next? (first unfinished thing, in order)
function nextTask() {
  for (let i = 0; i < CH.length; i++) {
    const c = CH[i];
    const ln = CHUNKS[c.id].findIndex((_, n) => !S.lessons[`${c.id}-${n + 1}`]);
    if (ln >= 0) return { go: `${c.id}-L${ln + 1}`, label: `Unit ${i + 1} · Lesson ${LETTERS[ln]}`, zh: `第 ${i + 1} 單元・小課 ${LETTERS[ln]}`, c };
    for (const k of [1, 2, 3]) if (!S.stars[`${c.id}-${k}`]) return { go: `${c.id}-${k}`, label: `Unit ${i + 1} · Mixed practice ${k}`, zh: `第 ${i + 1} 單元・綜合練習 ${k}`, c };
  }

function home() {
  const nt = nextTask(), started = Object.keys(S.stars).length || Object.keys(S.brief).length;
  const codesGot = CH.reduce((a, c) => a + CHUNKS[c.id].filter((_, n) => S.codes[`${c.id}-L${n + 1}`]).length, 0) + (S.codes.boss ? 1 : 0);
  const r = rankOf(totalStars());
  app.innerHTML = topBar() + `
  <section class="start">
    <div class="brand"><img src="${LOGO}" alt="良立文教 logo"><b>良立文教</b></div>
    <div class="duo">${avatar('nora', 104)}${avatar('theo', 104)}</div>
    <h1>Time Detective<span>時態偵探</span></h1>
    <p class="brand-tag">良立文教的小偵探 Nora 和 Theo<br>要帶你去鐘樓冒險，破解時態之謎！🔍</p>
    <p class="brand-promo">✏️ 良立文教老師精心為孩子設計<br>配合課堂講義，把六大時態做<b>邏輯式統整</b></p>
    <button class="go-btn" data-go="${nt.go}" style="--tc:${nt.c ? color(nt.c.id) : 'var(--ink)'}">▶ ${started ? 'Continue' : 'Start'} <small>${started ? '繼續' : '開始'}：${nt.label}<br>${nt.zh}</small></button>
    <div class="status"><span>${r[1]} ${r[2]}</span><span>⭐ ${totalStars()} / 54</span><span>🔑 ${codesGot} / ${CH.reduce((a, c) => a + CHUNKS[c.id].length, 0) + 1} codes 密碼</span></div>
  </section>
  <h2 class="pick">Pick a unit <span>選一個單元</span></h2>
  <div class="tiles">${CH.map((c, i) => {
    const LS = CHUNKS[c.id], n = LS.filter((_, k) => S.codes[`${c.id}-L${k + 1}`]).length;
    return `<button class="tile ${unitBadge(c.id) ? 'done' : ''}" style="--tc:${color(c.id)}" data-go="${c.id}">
      <span class="tile-top"><span class="tile-no">Unit ${i + 1}</span><span class="tile-ico">${UNIT_ICONS[c.id]}</span></span>
      <span class="tile-name">${c.name}</span><span class="tile-zh">${c.zh}</span>
      <span class="tile-lessons" aria-label="${n} of ${LS.length} lessons done">${LS.map((L, k) => { const got = S.codes[`${c.id}-L${k + 1}`]; return `<span class="tl ${got ? 'got' : ''}"><i>${got ? CODES[`${c.id}-${k + 1}`][0] : '①②③④'[k]}</i>${L.s}</span>`; }).join('')}</span>
      <span class="tile-foot"><span>🔑 ${n} / ${LS.length}</span><span class="tile-go">${n === LS.length ? '✓ Done' : n ? 'Go ▶' : 'Play ▶'}</span></span></button>`;
  }).join('')}
    <button class="tile boss-tile" style="--tc:var(--ink)" data-go="case-report">
      <span class="tile-top"><span class="tile-no">Final case</span><span class="tile-ico">👑</span></span>
      <span class="tile-name">${BOSS.title}</span><span class="tile-zh">六大時態總複習</span>
      <span class="tile-codes">${S.codes.boss ? `<span class="got">${CODES.boss[0]}</span>` : '<span>🔒</span>'}</span>

  </div>
  <details class="more"><summary>🏅 My badges 我的徽章</summary>${badgePanel()}</details>
  <details class="more"><summary>❓ How to play 怎麼玩</summary>
  <div class="how"><div><b>1 · Lessons</b>Watch one short animation, then practise it right away.</div><div><b>2 · Read</b>Read or listen to a case, then spot the verbs.</div><div><b>3 · Crack it</b>Match the verbs to a picture of time.</div><div><b>4 · Use it</b>Trust your ear, then fix broken sentences.</div></div>

    <li>每個密碼代表孩子完成了哪一個小課，請對照《家長驗收表》確認。</li>

    <li>建議節奏：上完課當天學完小課，之後每天玩一個案件（約 10–15 分鐘）。進度存在這台裝置的瀏覽器裡。</li></ul></div></details>
  <footer class="brand-foot"><img src="${LOGO}" alt=""><span>© 良立文教 英文教室・時態偵探</span></footer>`;
  wire(app);
}

}


// answer key for teachers (added)
function answerKey() {
  const blankFill = (text, ans) => esc(text).replace('___', `<span class="ans">${esc(ans)}</span>`);
  const verbs = story => (story.match(/\[\[.+?\]\]/g) || []).map(v => v.slice(2, -2));
  const fixLine = ([sent, wrong, opts, a, why]) => {
    const words = sent.split(' ').map(w => w.replace(/[.,!?]$/, '') === wrong ? `<span class="was">${esc(w)}</span> <span class="ans">${esc(opts[a])}${/[.,!?]$/.test(w) ? w.slice(-1) : ''}</span>` : esc(w));
    return `<li>${words.join(' ')} <span class="note">· ${why}</span></li>`;
  };
  const caseBlock = (c, label, withPattern) => `<h3>${label}: ${c.title}</h3>
    <p><b>Spot 找動詞</b>（${verbs(c.story).length}）: ${verbs(c.story).map(v => `<span class="ans">${esc(v)}</span>`).join('、')}</p>
    ${withPattern ? `<p><b>Crack the pattern 找規律</b>: <span class="ans">${esc(c.pattern.o[c.pattern.a])}</span></p><p><b>Picture it 時間線</b>: <span class="ans">${TL[c.id]}</span></p>` : `<p><b>Picture it 時間線</b>: <span class="ans">${TL[c.id]}</span></p>`}
    <p><b>Trust your ear 聽語感</b>（correct sentence 正確句子）</p><ol>${c.ear.map(([a, b, ans, why]) => `<li><span class="ans">${esc([a, b][ans])}</span> <span class="note">✗ ${esc([a, b][1 - ans])} · ${why}</span></li>`).join('')}</ol>
    <p><b>Story clues 填空</b></p><ol>${c.ctx.map(([t, o, a, why]) => `<li>${blankFill(t, o[a])} <span class="note">· ${why}</span></li>`).join('')}</ol>
    <p><b>Fix the sentence 改錯</b></p><ol>${c.fix.map(fixLine).join('')}</ol>`;
  const P = BOSS.parts, bossAns = []; for (let i = 1; i < P.length; i += 4) bossAns.push([P[i][P[i + 1]], P[i + 2]]);
  app.innerHTML = topBar() + `<section class="chead"><h2>Answer key 答案</h2>
      <p class="muted">Every answer in the app, unit by unit. For teachers and parents. In the game the choices are shuffled, so the letters (A/B/C) change each time; the answers below are the words themselves.<span class="zh">全部題目的答案。遊戲裡選項會隨機排列，所以這裡列出答案本身而不是 A/B/C。可以用瀏覽器列印。</span></p>
      <div class="row-btns no-print"><button class="ghost-btn" id="openall">Open all 全部展開</button><button class="ghost-btn" id="print">Print 列印</button></div></section>
    <section class="card akey">${CH.map((ch, i) => {
      const X = EXTRA[ch.id];
      return `<details style="--tc:${color(ch.id)}"><summary style="color:${color(ch.id)}">Unit ${i + 1} · ${ch.name} <span class="muted">${ch.zh}</span></summary>
        <h3>Briefing tries 簡報小練習</h3><ol>${X.brief.tries.map(([t, o, a, why]) => `<li>${blankFill(t, o[a])} <span class="note">· ${why}</span></li>`).join('')}</ol>
        ${caseBlock(ch, 'Case 1', true)}
        ${X.cases.map((c, k) => caseBlock(Object.assign({ id: ch.id }, c), `Case ${k + 2}`, false)).join('')}</details>`;
    }).join('')}
      <details style="--tc:var(--ink)"><summary>★ ${BOSS.title} <span class="muted">六大時態總複習</span></summary>
        <ol>${bossAns.map(([a, why]) => `<li><span class="ans">${esc(a)}</span> <span class="note">· ${why}</span></li>`).join('')}</ol></details></section>`;
  wire(app);
  document.getElementById('openall').onclick = () => app.querySelectorAll('details').forEach(d => d.open = true);
  document.getElementById('print').onclick = () => { app.querySelectorAll('details').forEach(d => d.open = true); setTimeout(() => window.print(), 50); };
}

// unit menu
function unit(ch) {
  const i = CH.indexOf(ch), X = EXTRA[ch.id];
  const titles = [ch.title, X.cases[0].title, X.cases[1].title];
  const doneK = k => !!S.stars[`${ch.id}-${k}`];
  const LS = CHUNKS[ch.id], lDone = n => !!S.lessons[`${ch.id}-${n}`];
  const nextL = LS.findIndex((_, n) => !lDone(n + 1)) + 1;
  const briefDone = !nextL;
  const nextK = [1, 2, 3].find(k => !doneK(k));
  const next = !briefDone ? { go: `${ch.id}-L${nextL}`, en: `Lesson ${LETTERS[nextL - 1]}`, zh: LS[nextL - 1].t, id: `L${nextL}` }
    : nextK ? { go: `${ch.id}-${nextK}`, en: `Mixed practice ${nextK}`, zh: `綜合練習 ${nextK}`, id: nextK }
    : CH[i + 1] ? { go: CH[i + 1].id, en: `Unit ${i + 2}`, zh: '下一個單元', id: 'nextunit' } : { go: 'case-report', en: 'Final case', zh: '總複習', id: 'boss' };
  const say = !briefDone ? 'Learn a little, then practise right away!' : nextK === 1 ? 'All lessons done! Now mix it all together.' : nextK ? `Great work! Mixed practice ${nextK} is waiting.` : 'Everything done! 🎉';
  const sayZh = !briefDone ? '學一小段，馬上練習！全部小課學完再辦案。' : nextK ? `小課的密碼都拿到了！下一關：綜合練習 ${nextK}（加分挑戰）` : '全部完成！';
  const node = (key, ico, label, sub, done, extra) => `<button class="lvl ${done ? 'done' : ''} ${next.id === key ? 'next' : ''}" data-go="${ch.id}-${key}">
      <span class="lvl-dot">${ico}</span><span class="lvl-label">${label}</span><span class="lvl-sub">${sub}</span>${extra || ''}
      <span class="lvl-go">${next.id === key ? 'Play ▶' : done ? '✓ Done' : 'Play'}</span></button>`;
  app.innerHTML = topBar() + `<div class="crumbs"><button class="back" data-go="home">← All units 全部單元</button></div>
    <section class="ubanner" style="--tc:${color(ch.id)}">
      <div class="ub-left"><span class="tile-no" style="background:#fff;color:var(--tc)">Unit ${i + 1}</span>
        <h2><span class="ub-ico">${UNIT_ICONS[ch.id]}</span> ${ch.name}</h2><div class="ub-zh">${ch.zh}・${ch.lessons}</div>
        <div class="row-btns"><button class="go-btn" style="--tc:#1d2340" data-go="${next.go}">▶ ${next.en} <small>${next.zh}</small></button><button class="anim-btn" data-go="${ch.id}-anim">🎬 Grammar animation<small>文法動畫</small></button></div></div>
      <div class="ub-right">${talk(nextK || !briefDone ? 'nora' : 'theo', `<p>${say}</p><p class="bz">${sayZh}</p>`, 84)}</div>
    </section>
    <div class="path" style="--tc:${color(ch.id)};--n:${LS.length + 3}">
      ${LS.map((L, n) => node(`L${n + 1}`, lDone(n + 1) ? CODES[`${ch.id}-${n + 1}`][0] : LETTERS[n], `Lesson ${LETTERS[n]}`, L.t, lDone(n + 1), '<span class="stars" style="visibility:hidden">★</span>')).join('')}
      ${titles.map((t, k) => node(k + 1, k + 1, `Mixed ${k + 1}`, t, doneK(k + 1), starsHTML(S.stars[`${ch.id}-${k + 1}`]))).join('')}
    </div>
    <p class="muted" style="text-align:center;font-size:14.5px">Each lesson = watch, practise right away, get a 🔑 code. Mixed practice = everything together, for ⭐ stars.<span class="zh-always">每個小課：看動畫 → 馬上練習 → 拿 🔑 密碼。綜合練習：全部混在一起練，拿 ⭐ 星星（加分挑戰）。</span></p>`;
  wire(app);
}

// briefing: short lesson + worked example + guided tries (not scored)
function briefing(ch) {
  const B = EXTRA[ch.id].brief, i = CH.indexOf(ch), K = KEYS[ch.id];
  const TRIES = B.tries.slice(0, 3);
  const cards = [
    { t: 'Story animation 文法故事動畫', body: playerHTML(ch.id) },
    { t: 'When? 什麼時候用', body: `${animTL(ch.id)}<p class="fc-big">${K.when}</p><p class="fc-zh">${K.zh}</p>` },
    { t: 'What does it look like? 長什麼樣子', body: `<p class="fc-shape">${K.shape}</p><p class="fc-zh">${K.shapeZh}</p>` },
    { t: 'Hear it 聽聽看', body: `<div class="fc-ex">${K.ex.map((e, k) => `<div><span>${e}</span><button class="listen" data-say="${k}">${speakerIcon}</button></div>`).join('')}</div>` },
  ];
  app.innerHTML = topBar() + `<section class="chead" style="--tc:${color(ch.id)}">
    <div class="crumbs"><button class="back" data-go="${ch.id}">← Unit ${i + 1}</button><span class="tag" style="--tc:${color(ch.id)}">${ch.name}</span><span class="tag" style="--tc:var(--muted)">${ch.zh}・${ch.lessons}</span></div>
    ${talk('theo', `<p>Watch our grammar story first, then 3 quick tries!</p><p class="bz">先看我們演的文法故事，再做 3 題小練習！</p>`)}</section>
    <section class="card flash" style="--tc:${color(ch.id)}" id="flash"></section>
    <section class="card" style="--tc:${color(ch.id)}" id="tries" hidden></section>
    <details class="more" style="--tc:${color(ch.id)}"><summary>📖 Stuck? More details 卡住了再看詳細說明</summary>
      ${B.blocks.map(([t, body]) => `<section class="bblock" style="margin-top:10px"><h3>${t}</h3>${body}</section>`).join('')}</details>`;
  wire(app);
  const fl = document.getElementById('flash'), box = document.getElementById('tries');
  let ci = 0;
  function card() {
    const c = cards[ci];
    fl.innerHTML = `<div class="fc-dots">${cards.map((_, k) => `<span class="${k <= ci ? 'on' : ''}"></span>`).join('')}</div>
      <div class="step-label">${ci + 1} · ${c.t}</div><div class="fc-body fc-in">${c.body}</div>
      <div class="row-btns" style="justify-content:flex-end">${ci ? '<button class="ghost-btn" id="prev">←</button>' : ''}<button class="big-btn" id="fnext">${ci < cards.length - 1 ? 'Next 下一張' : 'Try it! 試試看'} →</button></div>`;
    fl.querySelectorAll('[data-say]').forEach(x => x.onclick = () => speak(K.ex[+x.dataset.say].replace(/<[^>]+>/g, '')));
    mountPlayer(fl);
    const pv = fl.querySelector('#prev'); if (pv) pv.onclick = () => { ci--; card(); };
    fl.querySelector('#fnext').onclick = () => {
      if (ci < cards.length - 1) { ci++; card(); return; }
      fl.innerHTML = `<div class="fc-mini">${keyCard(ch)}</div>`; box.hidden = false; t(); box.scrollIntoView({ behavior: 'smooth', block: 'start' });
    };
  }
  card();
  let ti = 0;
  function t() {
    if (ti >= TRIES.length) {
      S.brief[ch.id] = true; save();
      box.innerHTML = `<div class="done-card"><div class="duo">${avatar('nora', 70, 'cheer')}${avatar('theo', 70, 'cheer')}</div><h2>Briefing done! 簡報完成</h2></div>
        <div class="row-btns" style="justify-content:center"><button class="go-btn" style="--tc:${color(ch.id)}" data-go="${ch.id}-1">▶ Case 1 <small>開始第 1 遍</small></button></div>`;
      wire(box); return;
    }
    const [text, opts0, a0, why] = TRIES[ti]; const [opts, ans] = mix(opts0, a0);
    box.innerHTML = `<div class="step-label">Your turn 換你 · ${ti + 1} / ${TRIES.length}</div>
      <p class="prompt">${esc(text).replace('___', '<span class="blank" id="bl">?</span>')}</p>
      <div class="opt-grid">${opts.map((o, k) => `<button class="opt" data-i="${k}"><span class="k">${'ABC'[k]}</span><span>${esc(o)}</span></button>`).join('')}</div>${revealBtn()}<div id="tfb"></div>`;
    const done = (shown) => {
      const fb = box.querySelector('#tfb'); const rb = box.querySelector('#reveal'); if (rb) rb.remove();
      box.querySelectorAll('.opt').forEach(x => x.disabled = true); box.querySelector('#bl').textContent = opts[ans];
      box.querySelector(`.opt[data-i="${ans}"]`).classList.add('right');
      fb.innerHTML = `<div class="feedback ${shown ? 'show' : 'good'}"><b>${shown ? `Answer: ${esc(opts[ans])}` : 'Right!'}</b><span class="why">${why}</span></div><button class="big-btn next" id="next" style="margin-top:10px">${ti < TRIES.length - 1 ? 'Next' : 'Finish'} →</button>`;
      fb.querySelector('#next').onclick = () => { ti++; t(); };
    };
    box.querySelector('#reveal').onclick = () => done(true);
    box.querySelectorAll('.opt').forEach(b => b.onclick = () => {
      const ok = +b.dataset.i === ans; b.classList.add(ok ? 'right' : 'wrong'); b.disabled = true;
      if (ok) done(false);
      else box.querySelector('#tfb').innerHTML = `<div class="feedback bad"><b>Not that one.</b><span class="why">Look at the card again 再看一下小卡。</span></div>`;
    });
  }
}

// chapter flow
function chapter(ch0, n) {
  const ch = n === 1 ? ch0 : Object.assign({}, ch0, EXTRA[ch0.id].cases[n - 2]);
  const key = `${ch0.id}-${n}`;
  const steps = n === 1 ? ['read', 'spot', 'pattern', 'timeline', 'ear', 'ctx', 'fix', 'done'] : ['read', 'spot', 'timeline', 'ear', 'ctx', 'fix', 'done'];
  const stepNo = () => step + 1;
  let step = 0, score = 0, total = 0, streak = 0, best = 0, peeks = 0;
  const liveHTML = () => `<span class="live" id="live" title="Stars this case"><span class="lstar">⭐ ${score}</span>${streak >= 2 ? `<span class="lstreak">🔥 ${streak}</span>` : ''}</span>`;
  const firstTry = (ok) => {
    total++;
    if (ok) { score++; streak++; best = Math.max(best, streak); toast(streak >= 3 ? `+1 ⭐  ${streak} in a row! 🔥` : '+1 ⭐'); }
    else streak = 0;
    const l = document.getElementById('live'); if (l) l.outerHTML = liveHTML();
  };

  function frame(inner) {
    app.innerHTML = topBar() + `<section class="chead" style="--tc:${color(ch.id)}">
      <div class="crumbs"><button class="back" data-go="${ch0.id}">← Unit ${CH.indexOf(ch0) + 1}</button><span class="tag" style="--tc:${color(ch.id)}">${ch.name}</span><span class="tag" style="--tc:var(--muted)">Mixed practice ${n} / 3 綜合練習</span><span class="zh">${ch.zh}・${ch.lessons}</span>${liveHTML()}</div>
      <h2>${ch.title}</h2>
      <div class="steps" aria-hidden="true">${steps.slice(0, -1).map((s, i) => `<span class="${i < step ? 'done' : i === step ? 'now' : ''}"></span>`).join('')}</div></section>`;
    const card = h(`<section class="card" style="--tc:${color(ch.id)}"></section>`);
    card.innerHTML = inner; app.appendChild(card); wire(app);
    card.addEventListener('click', e => { if (e.target.closest('#reveal')) peeks++; }, true);
    return card;
  }
  const nextBtn = (label = 'Next') => `<button class="big-btn next" id="next">${label} →</button>`;
  const advance = () => { step++; show(); window.scrollTo(0, 0); };

  function storyHTML(mode) {
    // split into targets [[...]] and words
    const parts = ch.story.split(/(\[\[.+?\]\])/);
    let html = '', ti = 0;
    for (const p of parts) {
      if (p.startsWith('[[')) { const t = p.slice(2, -2); html += `<span class="w t-verb" data-t="${ti++}">${esc(t)}</span>`; }
      else html += p.split(/(\s+)/).map(w => /\S/.test(w) ? `<span class="w">${esc(w)}</span>` : w).join('');
    }
    return `<div class="story ${mode}">${html}</div>`;
  }
  const targetCount = (ch.story.match(/\[\[/g) || []).length;

  function show() {
    const s = steps[step];
    if (s === 'read') {
      const c = frame(`<div class="step-label">Step 1 · Read</div><p>Read the case. Listen too, if you like.</p>
        <div><button class="listen" id="say">${speakerIcon}Listen</button></div>${storyHTML('plain')}${nextBtn('I’ve read it')}`);
      c.querySelector('#say').onclick = () => { if (!speak(ch.story)) c.querySelector('#say').textContent = 'Listening isn’t available on this device'; };
      c.querySelector('#next').onclick = advance;
    }
    if (s === 'spot') {
      let found = 0, misses = 0;
      const c = frame(`<div class="step-label">Step 2 · Spot</div><p>${ch.spot}</p><p class="counter" id="cnt">0 / ${targetCount} found</p>${storyHTML('spot')}${revealBtn()}<div id="fb"></div>`);
      c.querySelector('#reveal').onclick = () => {
        c.querySelectorAll('.story .w[data-t]:not(.found)').forEach(w => w.classList.add('found', 'shown'));
        c.querySelector('#reveal').remove();
        c.querySelector('#cnt').textContent = `${targetCount} / ${targetCount} shown`;
        c.querySelector('#fb').innerHTML = `<div class="feedback show"><b>Here are all the verbs.</b><span class="why">The ones with a dashed border are the ones you hadn’t found yet.</span></div>${nextBtn()}`;
        c.querySelector('#next').onclick = advance;
        c.querySelectorAll('.story').forEach(st => st.classList.replace('spot', 'read'));
      };
      c.querySelectorAll('.story .w').forEach(w => w.addEventListener('click', () => {
        if (!c.querySelector('.story.spot')) return;
        if (w.classList.contains('found')) return;
        if (w.dataset.t != null) { w.classList.add('found'); found++; }
        else { misses++; w.classList.add('miss', 'shake'); setTimeout(() => w.classList.remove('miss', 'shake'), 600); }
        c.querySelector('#cnt').textContent = `${found} / ${targetCount} found`;
        if (found === targetCount) {
          const rb = c.querySelector('#reveal'); if (rb) rb.remove();
          c.querySelector('#fb').innerHTML = `<div class="feedback good"><b>All found!</b><span class="why">${misses ? `You tapped ${misses} extra word${misses > 1 ? 's' : ''} on the way. That’s part of detective work.` : 'Not a single wrong tap.'}</span></div>${nextBtn()}`;
          c.querySelector('#next').onclick = advance;
          c.querySelectorAll('.story').forEach(st => st.classList.replace('spot', 'read'));
        }
      }));
    }
    if (s === 'pattern' || s === 'timeline') {
      const isP = s === 'pattern';
      const q = isP ? ch.pattern.q : 'Which picture matches the verbs you found?';
      const kinds = ['pres', 'prog', 'past', 'fut', 'pp', 'pastpf'];
      let opts, ans;
      if (isP) { [opts, ans] = mix(ch.pattern.o.map(esc), ch.pattern.a); }
      else {
        const others = kinds.filter(k => k !== ch.id).sort(() => Math.random() - .5).slice(0, 2);
        const list = [ch.id, ...others].sort(() => Math.random() - .5);
        opts = list.map(k => timeline(k, 280, true)); ans = list.indexOf(ch.id);
      }
      const c = frame(`<div class="step-label">Step ${stepNo()} · ${isP ? 'Crack the pattern' : 'Picture it'}</div><p class="prompt">${q}</p>
        <div class="opts">${opts.map((o, i) => `<button class="opt" data-i="${i}"><span class="k">${'ABC'[i]}</span><span>${o}</span></button>`).join('')}</div>${revealBtn()}<div id="fb"></div>`);
      let tried = false;
      const solve = (shown) => {
        const rb = c.querySelector('#reveal'); if (rb) rb.remove();
        c.querySelectorAll('.opt').forEach(x => x.disabled = true); c.querySelector(`.opt[data-i="${ans}"]`).classList.add('right');
        const head = shown ? `<div class="feedback show"><b>Answer: ${'ABC'[ans]}${isP ? '' : ` · ${TL[ch.id].toLowerCase()}`}.</b></div>`
          : (isP ? `<div class="feedback good"><b>Cracked it.</b></div>` : `<div class="feedback good"><b>Yes: ${TL[ch.id].toLowerCase()}.</b></div>`);
        c.querySelector('#fb').innerHTML = head + (isP ? keyCard(ch) : '') + nextBtn();
        c.querySelector('#next').onclick = advance;
      };
      c.querySelector('#reveal').onclick = () => { if (!tried) { firstTry(false); tried = true; } solve(true); };
      c.querySelectorAll('.opt').forEach(b => b.addEventListener('click', () => {
        const i = +b.dataset.i;
        if (i === ans) {
          if (!tried) firstTry(true);
          solve(false);
        } else {
          if (!tried) { firstTry(false); tried = true; }
          b.classList.add('wrong'); b.disabled = true;
          c.querySelector('#fb').innerHTML = `<div class="feedback bad"><b>Not quite. Look at the story again and try another one.</b></div>`;
        }
      }));
    }
    if (s === 'ear' || s === 'ctx' || s === 'fix') runSet(s);
    if (s === 'done') {
      const stars = score >= total - 1 ? 3 : score >= Math.ceil(total * .65) ? 2 : 1;
      const before = { total: totalStars(), badge: unitBadge(ch0.id), rank: rankOf(totalStars()) };
      S.stars[key] = Math.max(S.stars[key] || 0, stars); save();
      const after = { total: totalStars(), badge: unitBadge(ch0.id), rank: rankOf(totalStars()) };
      const gained = after.total - before.total;
      const earned = false; // codes now come from lessons; cases are mixed practice
      const news = [];
      if (gained > 0) news.push(`+${gained} ⭐ added to your total (${after.total} / 54)`);
      if (!before.badge && after.badge) news.push(`New badge: ${UNIT_ICONS[ch0.id]} ${ch0.name}!`);
      if (after.rank !== before.rank) news.push(`Promoted to ${after.rank[1]} ${after.rank[2]} (${after.rank[3]})!`);
      const i = CH.indexOf(ch0), nx = CH[i + 1];
      const nextBtnHTML = n < 3 ? `<button class="big-btn" data-go="${ch0.id}-${n + 1}">Next: Mixed practice ${n + 1} →</button>`
        : nx ? `<button class="big-btn" data-go="${nx.id}">Next unit: ${nx.name} →</button>` : `<button class="big-btn" data-go="case-report">Open the final case →</button>`;
      const c = frame(`<div class="done-card card" style="border:none;padding:0"><div class="duo">${avatar('nora', 84, 'cheer')}${avatar('theo', 84, 'cheer')}</div>${starsHTML(stars)}<h2>Mixed practice ${n} done! 綜合練習完成</h2>
        <p class="muted">${score} of ${total} right on the first try.${best >= 3 ? ` Best streak: 🔥 ${best}.` : ''} ${n < 3 ? 'Ready for the next one?' : 'All three done. The rule card is in your Casebook.'}</p></div>
        ${!earned ? '' : `<div class="nocode">🔒 No code this time: you used “Show answer” ${peeks} times (the limit is ${MAX_PEEKS}).<br>Play this case again to get your parent check code.<span class="zh">這次按了 ${peeks} 次「看答案」（最多 ${MAX_PEEKS} 次），沒有拿到驗收密碼。再玩一次就可以拿到。</span></div>`}
        ${news.map(x => `<div class="newbadge">${x}</div>`).join('')}
        ${keyCard(ch)}
        <div class="row-btns">${nextBtnHTML}
        <button class="ghost-btn" id="again">Play this case again</button></div>`);
      c.querySelector('#again').onclick = () => { step = 0; score = 0; total = 0; streak = 0; best = 0; peeks = 0; show(); };
      confetti(stars === 3 || news.length > 1 ? 34 : 14);
      wire(c);
    }
  }

  function runSet(kind) {
    const set = kind === 'ear' ? ch.ear : kind === 'ctx' ? ch.ctx : ch.fix;
    const label = `Step ${stepNo()} · ` + { ear: 'Trust your ear', ctx: 'Story clues', fix: 'Fix the broken sentence' }[kind];
    let qi = 0;
    function q() {
      const item = set[qi];
      const head = `<div class="step-label">${label}</div><div class="qcount">${qi + 1} of ${set.length}</div>`;
      let tried = false;
      const finish = (ok, why, shown) => {
        const fb = c.querySelector('#fb');
        if (ok) { const rb = c.querySelector('#reveal'); if (rb) rb.remove(); }
        fb.innerHTML = `<div class="feedback ${shown ? 'show' : ok ? 'good' : 'bad'}"><b>${shown ? `Answer: ${esc(shown)}` : ok ? 'Right.' : 'Not that one.'}</b><span class="why">${why}</span></div>`;
        if (ok) { fb.innerHTML += nextBtn(qi < set.length - 1 ? 'Next' : 'Continue'); fb.querySelector('#next').onclick = () => { qi++; qi < set.length ? q() : advance(); }; }
      };
      let c;
      if (kind === 'ear') {
        let [a, b, ans, why] = item; if (Math.random() < .5) { [a, b] = [b, a]; ans = 1 - ans; }
        c = frame(head + `<p class="prompt">Which one sounds right?</p>
          <div class="opt-grid">${[a, b].map((t, i) => `<div style="display:grid;gap:6px"><button class="opt" data-i="${i}"><span class="k">${'AB'[i]}</span><span>${esc(t)}</span></button>
            <button class="listen" data-say="${i}" style="justify-self:start">${speakerIcon}Hear ${'AB'[i]}</button></div>`).join('')}</div>${revealBtn()}<div id="fb"></div>`);
        c.querySelector('#reveal').onclick = () => {
          if (!tried) { firstTry(false); tried = true; }
          c.querySelectorAll('.opt').forEach(x => x.disabled = true); c.querySelector(`.opt[data-i="${ans}"]`).classList.add('right');
          finish(true, why, `${'AB'[ans]} · ${[a, b][ans]}`);
        };
        c.querySelectorAll('[data-say]').forEach(x => x.onclick = () => speak([a, b][+x.dataset.say]));
        c.querySelectorAll('.opt').forEach(btn => btn.onclick = () => {
          const ok = +btn.dataset.i === ans;
          if (!tried) { firstTry(ok); tried = true; }
          btn.classList.add(ok ? 'right' : 'wrong'); btn.disabled = true;
          if (ok) c.querySelectorAll('.opt').forEach(x => x.disabled = true);
          finish(ok, ok ? why : 'Say both out loud and listen again.');
        });
      }
      if (kind === 'ctx') {
        const [text, opts0, ans0, why] = item; const [opts, ans] = mix(opts0, ans0);
        c = frame(head + `<p class="prompt">${esc(text).replace('___', '<span class="blank" id="bl">?</span>')}</p>
          <div class="opts">${opts.map((o, i) => `<button class="opt" data-i="${i}"><span class="k">${'ABC'[i]}</span><span>${esc(o)}</span></button>`).join('')}</div>${revealBtn()}<div id="fb"></div>`);
        c.querySelector('#reveal').onclick = () => {
          if (!tried) { firstTry(false); tried = true; }
          c.querySelectorAll('.opt').forEach(x => x.disabled = true); c.querySelector(`.opt[data-i="${ans}"]`).classList.add('right');
          c.querySelector('#bl').textContent = opts[ans];
          finish(true, why, `${'ABC'[ans]} · ${opts[ans]}`);
        };
        c.querySelectorAll('.opt').forEach(btn => btn.onclick = () => {
          const ok = +btn.dataset.i === ans;
          if (!tried) { firstTry(ok); tried = true; }
          btn.classList.add(ok ? 'right' : 'wrong'); btn.disabled = true;
          if (ok) { c.querySelectorAll('.opt').forEach(x => x.disabled = true); c.querySelector('#bl').textContent = opts[ans]; }
          finish(ok, ok ? why : 'Read the whole sentence again. What is the story telling you about time?');
        });
      }
      if (kind === 'fix') {
        const [sent, wrongWord, opts0, ans0, why] = item; const [opts, ans] = mix(opts0, ans0);
        const words = sent.split(' ');
        c = frame(head + `<p class="prompt">One word breaks this sentence. Tap it.</p>
          <div class="wordline">${words.map((w, i) => `<button data-w="${i}">${esc(w)}</button>`).join('')}</div><div id="pick"></div>${revealBtn()}<div id="fb"></div>`);
        let missed = false;
        c.querySelector('#reveal').onclick = () => {
          if (!tried) { firstTry(false); tried = true; }
          const wi = words.findIndex(w => w.replace(/[.,!?]$/, '') === wrongWord);
          const btn = c.querySelector(`[data-w="${wi}"]`);
          c.querySelectorAll('[data-w]').forEach(x => { x.disabled = true; x.classList.remove('bad'); });
          btn.classList.add('hit'); btn.textContent = opts[ans] + (/[.,!?]$/.test(words[wi]) ? words[wi].slice(-1) : '');
          c.querySelector('#pick').innerHTML = '';
          finish(true, why, `${wrongWord} → ${opts[ans]}`);
        };
        c.querySelectorAll('[data-w]').forEach(btn => btn.onclick = () => {
          const w = words[+btn.dataset.w].replace(/[.,!?]$/, '');
          if (w !== wrongWord) { missed = true; btn.classList.add('bad', 'shake'); setTimeout(() => btn.classList.remove('shake'), 400); c.querySelector('#fb').innerHTML = `<div class="feedback bad"><b>That word is fine.</b><span class="why">Read the sentence out loud. Which word sounds wrong?</span></div>`; return; }
          c.querySelectorAll('[data-w]').forEach(x => x.disabled = true); btn.classList.add('hit'); c.querySelector('#fb').innerHTML = '';
          c.querySelector('#pick').innerHTML = `<p style="margin-bottom:8px">Good eye. What should it be?</p><div class="opts">${opts.map((o, i) => `<button class="opt" data-i="${i}"><span class="k">${'ABC'[i]}</span><span>${esc(o)}</span></button>`).join('')}</div>`;
          c.querySelectorAll('#pick .opt').forEach(ob => ob.onclick = () => {
            const ok = +ob.dataset.i === ans;
            if (!tried) { firstTry(ok && !missed); tried = true; }
            ob.classList.add(ok ? 'right' : 'wrong'); ob.disabled = true;
            if (ok) { c.querySelectorAll('#pick .opt').forEach(x => x.disabled = true); btn.textContent = opts[ans] + (/[.,!?]$/.test(words[+btn.dataset.w]) ? words[+btn.dataset.w].slice(-1) : ''); }
            finish(ok, ok ? why : 'Try another one.');
          });
        });
      }
    }
    q();
  }
  show();
}

function boss() {
  const P = BOSS.parts; const gaps = [];
  let html = '';
  for (let i = 0; i < P.length;) {
    html += esc(P[i]); i++;
    if (i < P.length) { const g = gaps.length; const [mo, ma] = mix(P[i], P[i + 1]); gaps.push({ o: mo, a: ma, why: P[i + 2] }); html += `<sup>${g + 1}</sup><select id="g${g}" aria-label="Gap ${g + 1}"><option value="">choose…</option>${mo.map((o, j) => `<option value="${j}">${esc(o)}</option>`).join('')}</select>`; i += 3; }
  }
  app.innerHTML = topBar() + `<section class="chead"><div class="crumbs"><button class="back" data-go="home">← All units</button><span class="tag" style="--tc:var(--ink)">All six tenses</span><span class="zh">六大時態總複習</span></div><h2>${BOSS.title}</h2></section>
    <section class="card" style="--tc:var(--ink)">${talk('nora', `<p>${BOSS.intro}</p>`)}<div class="report">${html}</div>
    <div class="row-btns"><button class="big-btn" id="check">Check my report</button><button class="reveal-btn" id="fillall">💡 Show all answers · 看答案</button></div><div id="res"></div></section>`;
  wire(app);
  let usedFill = false;
  document.getElementById('fillall').onclick = () => { usedFill = true;
    gaps.forEach((g, i) => { const sel = document.getElementById('g' + i); sel.value = String(g.a); sel.classList.remove('wrong'); sel.classList.add('right'); });
    document.getElementById('res').innerHTML = `<div class="feedback show"><b>All answers filled in.</b><span class="why">This doesn’t change your saved score.</span></div><div class="whys">${gaps.map((g, i) => `<div class="ok"><b>${i + 1}. ${esc(g.o[g.a])}</b> <span class="muted">${g.why}</span></div>`).join('')}</div>`;
  };
  document.getElementById('check').onclick = () => {
    let right = 0; const lines = [];
    gaps.forEach((g, i) => {
      const sel = document.getElementById('g' + i); const v = sel.value;
      const ok = v !== '' && +v === g.a; if (ok) right++;
      sel.classList.toggle('right', ok); sel.classList.toggle('wrong', !ok);
      lines.push(`<div class="${ok ? 'ok' : 'no'}"><b>${i + 1}. ${esc(g.o[g.a])}</b> ${ok ? '' : v === '' ? '(not answered) ' : `(you chose “${esc(g.o[+v])}”) `}<span class="muted">${g.why}</span></div>`);
    });
    if (!usedFill) { S.boss = Math.max(S.boss || 0, right); save(); }
    if (right === 10) confetti(40);
    const bossCode = right === 10 && !usedFill;
    if (bossCode) { S.codes.boss = true; save(); }
    document.getElementById('res').innerHTML = `<div class="feedback ${right >= 8 ? 'good' : 'bad'}"><b>${right} / 10 correct.</b><span class="why">${right === 10 ? 'Case closed. Every tense in the right place.' : 'Fix the red ones and check again. The notes below explain each gap.'}</span></div><div class="whys">${lines.join('')}</div>`;
    if (bossCode) document.getElementById('res').insertAdjacentHTML('afterbegin', codeCard('boss'));
    else if (right === 10 && usedFill) document.getElementById('res').insertAdjacentHTML('afterbegin', `<div class="nocode">🔒 You used “Show all answers”, so there is no code this time. Reload the page and try it on your own.<span class="zh">按過「顯示全部答案」就拿不到密碼，重新整理頁面自己做一次。</span></div>`);
  };
}

render();
</script>
