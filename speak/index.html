<meta property="og:title" content="良立文教｜全民英檢初級複試 口說練習模擬器">
<style>
:root{--ink:#24324a;--muted:#6b7890;--bg:#fff8ec;--card:#fff;--pri:#ff7a45;--pri2:#ffb347;--ok:#2fb36d;--miss:#ff9f1c;--blue:#3d7bfd;--purple:#8a5cf6;--r:22px}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--ink);font-family:-apple-system,BlinkMacSystemFont,"PingFang TC","Noto Sans TC","Microsoft JhengHei",sans-serif}
body{min-height:100vh;padding:env(safe-area-inset-top) 0 env(safe-area-inset-bottom)}
#app{max-width:560px;margin:0 auto;padding:14px 16px 40px}
button{font:inherit;color:inherit;border:0;cursor:pointer}
.top{display:flex;align-items:center;gap:10px;margin-bottom:12px}
.top .back{background:#fff;border-radius:14px;padding:8px 12px;font-size:18px;box-shadow:0 2px 0 #f0e2c8}
.top .ttl{flex:1;font-weight:800;font-size:17px;line-height:1.2}
.top .ttl small{display:block;font-weight:600;color:var(--muted);font-size:12px}
.icon-btn{background:#fff;border-radius:14px;padding:8px 11px;font-size:18px;box-shadow:0 2px 0 #f0e2c8}
.dots{display:flex;gap:6px;justify-content:center;margin:4px 0 14px}
.dots i{width:10px;height:10px;border-radius:50%;background:#ecdcc0}
.dots i.done{background:var(--ok)}.dots i.cur{background:var(--pri);transform:scale(1.35)}
.card{background:var(--card);border-radius:var(--r);padding:18px;box-shadow:0 4px 0 #f0e2c8;margin-bottom:14px}
/* home */
.hero{text-align:center;padding:8px 0 4px}
.hero .logo{width:54px;height:54px}
.hero h1{margin:6px 0 0;font-size:30px;letter-spacing:.5px}
.hero h1 span{color:var(--pri)}
.hero p{margin:4px 0 0;color:var(--muted);font-size:14px}
.week{background:linear-gradient(135deg,#ffd166,#ff9f6e);border-radius:var(--r);padding:16px 18px;color:#4a2a10;margin:14px 0;position:relative;overflow:hidden}
.week b{font-size:13px;opacity:.8}.week h2{margin:2px 0 0;font-size:26px}.week .zh{font-size:15px;font-weight:700}
.week .sun{position:absolute;right:-6px;top:-8px;font-size:72px;opacity:.9}
.tiles{display:grid;gap:12px}
.tile{display:flex;align-items:center;gap:14px;background:#fff;border-radius:var(--r);padding:14px 16px;box-shadow:0 4px 0 #f0e2c8;text-align:left;width:100%}
.tile .em{font-size:34px;width:52px;height:52px;display:grid;place-items:center;border-radius:16px;background:#fff1de;flex:none}
.tile .tx{flex:1}.tile .tx b{font-size:18px;display:block}.tile .tx small{color:var(--muted);font-size:13px}
.tile .st{font-size:13px;font-weight:800;color:var(--muted);text-align:center;min-width:48px}
.tile .st .cd{font-size:28px;display:block}
.tile.next{outline:3px solid var(--pri);outline-offset:-3px}
.tile.boss .em{background:#efe6ff}
.foot{text-align:center;color:var(--muted);font-size:12px;margin-top:22px;line-height:1.7}
.banner{background:#fff3cd;border-radius:16px;padding:12px 14px;font-size:14px;margin-bottom:12px;line-height:1.5}
/* item */
.say{font-size:26px;font-weight:800;line-height:1.45;text-align:center;margin:6px 0 4px;word-break:break-word}
.say .w{display:inline-block;padding:0 2px;border-radius:8px;transition:background .3s,color .3s}
.say .w.ok{color:var(--ok)}
.say .w.miss{color:#fff;background:var(--miss)}
.hidden-say{display:flex;flex-wrap:wrap;gap:8px;justify-content:center;margin:14px 0}
.hidden-say i{height:22px;border-radius:8px;background:#ecdcc0;display:inline-block}
.sub{color:var(--muted);text-align:center;font-size:14px;margin:6px 0}
.heard{background:#f4f7ff;border-radius:14px;padding:10px 12px;font-size:15px;margin:10px 0 0;color:#3a4a6a}
.heard b{color:var(--muted);font-size:12px;display:block}

// ───────── 朗讀聲音（挑裝置上最自然的英文聲音） ─────────
const NOVELTY = /Albert|Bad News|Bahh|Bells|Boing|Bubbles|Cellos|Deranged|Good News|Hysterical|Jester|Junior|Organ|Ralph|Superstar|Trinoids|Whisper|Wobble|Zarvox|Fred|Kathy|Princess|Grandma|Grandpa|Eddy|Flo|Reed|Rocko|Sandy|Shelley/i;
function rankVoice(v) {
  if (!/^en[-_]/i.test(v.lang) || NOVELTY.test(v.name)) return -1;
  let sc = 0;
  if (/Natural|Neural|Online|Premium|Enhanced|Siri/i.test(v.name)) sc += 100;
  if (/Google US English|Google UK English Female/i.test(v.name)) sc += 90;
  if (/Ava|Samantha|Allison|Susan|Serena|Kate|Karen|Moira|Tessa|Aria|Jenny|Libby|Sonia|Michelle|Emma/i.test(v.name)) sc += 50;
  if (/^en[-_]US/i.test(v.lang)) sc += 12; else if (/^en[-_]GB/i.test(v.lang)) sc += 10;
  if (/Zira|David|Mark/i.test(v.name)) sc -= 10;
  return sc;
}
let VOICES = [];
function loadVoices() { try { VOICES = (speechSynthesis.getVoices() || []).map(v => [rankVoice(v), v]).filter(x => x[0] >= 0).sort((a, b) => b[0] - a[0]).map(x => x[1]); } catch (e) { VOICES = []; } }
try { if (window.speechSynthesis) { loadVoices(); speechSynthesis.addEventListener('voiceschanged', loadVoices); } } catch (e) {}
function speak(text, rate = 0.85) {
  return new Promise(res => {
    try {
      const sy = window.speechSynthesis; if (!sy) return res();
      if (!VOICES.length) loadVoices();
      sy.cancel();
      const u = new SpeechSynthesisUtterance(plain(text));
      const v = VOICES[0]; if (v) { u.voice = v; u.lang = v.lang; } else u.lang = 'en-US';
      u.rate = rate;
      let fin = false; const end = () => { if (!fin) { fin = true; res(); } };
      u.onend = end; u.onerror = end;
      setTimeout(end, 1200 + plain(text).length * 110);   // 保險：有些手機不會觸發 onend
      sy.speak(u);
    } catch (e) { res(); }
  });
}
const stopSpeak = () => { try { speechSynthesis.cancel(); } catch (e) {} };

// ───────── 錄音 + 語音辨識 ─────────
const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
let srBroken = false;            // 某些手機辨識和錄音不能同時用 → 自動改成只錄音
const canRecord = !!(navigator.mediaDevices && navigator.mediaDevices.getUserMedia && window.MediaRecorder);
const hasSR = () => !!SR && !srBroken;
function pickMime() { for (const t of ['audio/mp4', 'audio/webm;codecs=opus', 'audio/webm', 'audio/aac']) { try { if (MediaRecorder.isTypeSupported(t)) return t; } catch (e) {} } return ''; }

// start() → returns session; session.stop() → Promise<{text, url}>
async function startCapture(onInterim, shared) {
  const ses = { text: '', interim: '', url: null, rec: null, mr: null, stream: null, chunks: [] };
  stopSpeak(); musicOff();
  // 1) 語音辨識
  if (hasSR()) {
    try {
      const r = new SR(); r.lang = 'en-US'; r.interimResults = true; r.continuous = true; r.maxAlternatives = 1;
      r.onresult = e => {
        let fin = '', tmp = '';
        for (let i = 0; i < e.results.length; i++) { const t = e.results[i][0].transcript; if (e.results[i].isFinal) fin += ' ' + t; else tmp += ' ' + t; }
        ses.text = fin.trim(); ses.interim = tmp.trim();
        onInterim && onInterim((ses.text + ' ' + ses.interim).trim());
      };
      r.onerror = e => { if (e.error === 'audio-capture' || e.error === 'service-not-allowed') { srBroken = true; } if (e.error === 'not-allowed') { srBroken = true; } };
      ses.recEnded = new Promise(res => { r.onend = res; });
      r.start(); ses.rec = r;
    } catch (e) { ses.rec = null; }
  }
  // 2) 錄音（給孩子聽自己的聲音）
  if (canRecord) {
    try {
      ses.stream = shared || await navigator.mediaDevices.getUserMedia({ audio: { echoCancellation: true, noiseSuppression: true } });
      const mime = pickMime();
      ses.mr = mime ? new MediaRecorder(ses.stream, { mimeType: mime }) : new MediaRecorder(ses.stream);
      ses.mr.ondataavailable = e => { if (e.data && e.data.size) ses.chunks.push(e.data); };
      ses.mrEnded = new Promise(res => { ses.mr.onstop = res; });
      ses.mr.start();
    } catch (e) {
      ses.mr = null;
      if (!ses.rec) { toast('沒有麥克風權限 🙈 請在瀏覽器設定允許「麥克風」'); }
    }
  }
  ses.stop = async () => {
    const waits = [];
    if (ses.mr && ses.mr.state !== 'inactive') { try { ses.mr.stop(); waits.push(ses.mrEnded); } catch (e) {} }
    if (ses.rec) { try { ses.rec.stop(); waits.push(ses.recEnded); } catch (e) {} }
    await Promise.race([Promise.all(waits), new Promise(r => setTimeout(r, 2500))]);
    if (ses.stream && !shared) ses.stream.getTracks().forEach(t => t.stop());   // 釋放麥克風，iPhone 喇叭音量才會正常
    if (ses.chunks.length) ses.url = URL.createObjectURL(new Blob(ses.chunks, { type: ses.chunks[0].type || 'audio/mp4' }));
    const text = (ses.text || ses.interim || '').trim();
    return { text, url: ses.url };
  };
  return ses;
}
let player = null;
function playUrl(url) { return new Promise(res => { if (!url) return res(); stopSpeak(); if (player) player.pause(); player = new Audio(url); player.onended = res; player.onerror = res; player.play().catch(res); }); }

// ───────── 比對：哪些字說到了 ─────────
const CONTR = { "i'm": 'i am', "it's": 'it is', "didn't": 'did not', "don't": 'do not', "i'll": 'i will', "we're": 'we are', "you're": 'you are', "that's": 'that is', "let's": 'let us', "won't": 'will not' };
const words = s => s.toLowerCase().replace(/[’‘]/g, "'").replace(/[^a-z0-9' ]+/g, ' ').split(/\s+/).filter(Boolean);
const heardWords = s => words(s).flatMap(w => (CONTR[w] || w).split(' ')).map(w => w.replace(/'s$/, ''));
function lev(a, b) { const m = []; for (let i = 0; i <= a.length; i++) { m[i] = [i]; for (let j = 1; j <= b.length; j++) m[i][j] = i ? Math.min(m[i - 1][j] + 1, m[i][j - 1] + 1, m[i - 1][j - 1] + (a[i - 1] === b[j - 1] ? 0 : 1)) : j; } return m[a.length][b.length]; }
function match(target, heard) {
  const H = heardWords(heard);
  const T = target.split(/\s+/).map(tok => ({ tok, w: words(tok)[0] || '' }));
  T.forEach(t => { const w = (CONTR[t.w] || t.w).split(' ')[0].replace(/'s$/, ''); t.ok = !w || H.some(h => h === w || (w.length >= 5 && h.slice(0, 3) === w.slice(0, 3) && lev(h, w) <= 1)); });
  const n = T.filter(t => t.w).length, k = T.filter(t => t.w && t.ok).length;
  return { T, score: n ? k / n : 0 };
}
const colored = T => T.map(t => `<span class="w ${t.ok ? 'ok' : 'miss'}">${esc(t.tok)}</span>`).join(' ');
const PAST = /\b(went|was|were|did|had|ate|saw|played|visited|watched|read|made|got|took|bought|swam|ran|rode|met|stayed|cooked|walked|helped|cleaned|drew|sang|danced|slept|came|gave|flew|drank|wrote|found|enjoyed|liked|loved|\w+ed)\b/;
function checkAnswer(it, text) {
  const W = heardWords(text), s = W.join(' ');
  const out = [{ lbl: '完整句子', ok: W.length >= 4 }];
  if (it.tense === 'past') out.push({ lbl: '過去式', ok: PAST.test(s) });
  if (it.tense === 'fut') out.push({ lbl: 'will', ok: /\bwill\b|\bgoing to\b/.test(s) });
  if (it.tense === 'pres') out.push({ lbl: '現在式', ok: W.length >= 3 && !/\bwill\b/.test(s) && !/\b(went|did|was|were|played|watched|visited)\b/.test(s) });
  if (it.reason) out.push({ lbl: 'because', ok: /\bbecause\b|\bcause\b/.test(s) });
  return out;
}

// ───────── 背景音樂（原創、Web Audio，只在首頁輕輕播） ─────────
let AC = null, musicTimer = null, musicOn = S.music !== false;
function musicStart() {
  if (!musicOn || musicTimer) return;
  try {
    AC = AC || new (window.AudioContext || window.webkitAudioContext)(); AC.resume();
    const notes = [523.25, 659.25, 783.99, 659.25, 587.33, 698.46, 880, 698.46, 523.25, 659.25, 783.99, 1046.5, 987.77, 783.99, 659.25, 587.33];
    let i = 0;
    const tick = () => {
      const t = AC.currentTime, f = notes[i % notes.length];
      const o = AC.createOscillator(), g = AC.createGain();
      o.type = 'triangle'; o.frequency.value = f;
      g.gain.setValueAtTime(0, t); g.gain.linearRampToValueAtTime(.045, t + .02); g.gain.exponentialRampToValueAtTime(.0005, t + .5);
      o.connect(g).connect(AC.destination); o.start(t); o.stop(t + .55);
      if (i % 4 === 0) { const b = AC.createOscillator(), bg = AC.createGain(); b.type = 'sine'; b.frequency.value = f / 4; bg.gain.setValueAtTime(.06, t); bg.gain.exponentialRampToValueAtTime(.0005, t + 1); b.connect(bg).connect(AC.destination); b.start(t); b.stop(t + 1.05); }
      i++;
    };
    musicTimer = setInterval(tick, 300);
  } catch (e) {}
}
function musicOff() { if (musicTimer) { clearInterval(musicTimer); musicTimer = null; } }
function chime(ok = true) {
  try {
    AC = AC || new (window.AudioContext || window.webkitAudioContext)(); AC.resume();
    (ok ? [784, 988, 1319] : [440, 392]).forEach((f, k) => { const t = AC.currentTime + k * .11, o = AC.createOscillator(), g = AC.createGain(); o.type = 'sine'; o.frequency.value = f; g.gain.setValueAtTime(.12, t); g.gain.exponentialRampToValueAtTime(.001, t + .35); o.connect(g).connect(AC.destination); o.start(t); o.stop(t + .4); });
  } catch (e) {}
}
function confetti() {
  const c = document.createElement('div'); c.className = 'confetti';
  const col = ['#ff7a45', '#ffd166', '#2fb36d', '#3d7bfd', '#8a5cf6'];
  for (let i = 0; i < 60; i++) { const p = document.createElement('i'); p.style.left = Math.random() * 100 + '%'; p.style.background = col[i % 5]; p.style.animationDelay = Math.random() * .8 + 's'; c.appendChild(p); }
  document.body.appendChild(c); setTimeout(() => c.remove(), 3600);
}

// ───────── 共用：大麥克風（按住說話） ─────────
function micHTML(lbl = '按住說話', maxSec = 0) {
  return `<div class="mic-wrap"><button class="mic" id="mic" aria-label="按住說話">🎤</button>${maxSec ? `<svg class="ring" viewBox="0 0 148 148"><circle cx="74" cy="74" r="68" stroke="#f1e6d2"/><circle id="ringp" cx="74" cy="74" r="68" stroke="#ff5a36" stroke-dasharray="427" stroke-dashoffset="0" transform="rotate(-90 74 74)"/></svg>` : ''}<div class="mic-lbl" id="miclbl">${lbl}</div></div>`;
}
// 綁定按住錄音；onDone({text,url})
function bindMic(onDone, { maxSec = 12, onLive } = {}) {
  const mic = $('#mic'), lbl = $('#miclbl'), ring = $('#ringp');
  if (!mic) return;
  let ses = null, busy = false, held = false, timer = null, t0 = 0;
  const down = async e => {
    e.preventDefault(); if (busy || mic.disabled) return;
    busy = true; held = true; mic.classList.add('rec'); lbl.textContent = '🔴 說吧… 說完放開';
    if (navigator.vibrate) navigator.vibrate(30);
    t0 = Date.now();
    ses = await startCapture(onLive);
    if (!held) return finishUp();          // 開麥克風時就已經放開
    timer = setInterval(() => {
      const p = (Date.now() - t0) / 1000 / maxSec;
      if (ring) ring.style.strokeDashoffset = String(427 * Math.min(1, p));
      if (p >= 1) up();
    }, 100);
  };
  const up = e => {
    if (e) e.preventDefault();
    if (!held) return;
    held = false; mic.classList.remove('rec'); clearInterval(timer);
    if (ses) finishUp();                   // 否則等 down 開完麥克風再收尾
  };
  const finishUp = async () => {
    const s = ses; ses = null;
    if (ring) ring.style.strokeDashoffset = '0';
    if (Date.now() - t0 < 600) { await s.stop(); busy = false; lbl.textContent = '要「按住」不放喔 👆'; return; }
    lbl.textContent = '⏳ 聽聽看…'; mic.disabled = true;
    const r = await s.stop();
    mic.disabled = false; busy = false; lbl.textContent = '按住再說一次';
    onDone(r);
  };
  mic.addEventListener('pointerdown', down);
  ['pointerup', 'pointercancel', 'pointerleave'].forEach(ev => mic.addEventListener(ev, up));
  mic.addEventListener('contextmenu', e => e.preventDefault());
}

function toggleMusic() { musicOn = !musicOn; S.music = musicOn; save(); $('#mus').textContent = musicOn ? '🎵' : '🔇'; musicOn ? musicStart() : musicOff(); }
function kickMusic() { if (musicOn) { const kick = () => { musicStart(); document.removeEventListener('pointerdown', kick); }; if (AC && AC.state === 'running') musicStart(); else document.addEventListener('pointerdown', kick); } }
function unitHome() {
  stopSpeak();
  const ls = WEEK.lessons; const nextIdx = ls.findIndex(l => !S.done[l.id]);
  app.innerHTML = `
  <div class="top"><button class="back" id="uback">← 全部單元</button><div class="ttl"></div><button class="icon-btn" id="mus">${musicOn ? '🎵' : '🔇'}</button></div>
  <div class="week" style="background:linear-gradient(135deg,${UNIT.bg[0]},${UNIT.bg[1]})"><span class="sun">${WEEK.icon}</span><b>UNIT ${WEEK.no}</b><h2>${WEEK.title}</h2><div class="zh">${WEEK.zh}</div></div>
  <a class="src" href="${SRC_URL}" target="_blank" rel="noopener">📌 主題出處：${SRC[UNIT.src][0]}<br>${SRC[UNIT.src][1]}</a>
  <div class="sec-h">📚 先練習（一題一題練，有提示）</div>
  <div class="tiles">${ls.map((l, i) => {
    const d = S.done[l.id];
    return `<button class="tile ${i === nextIdx ? 'next' : ''} ${l.boss ? 'boss' : ''}" data-l="${i}">
      <span class="em">${l.em}</span><span class="tx"><b>${i + 1}. ${l.name}</b><small>${l.en}${l.boss ? '・上課老師要考這段 ⭐' : ''}</small></span>
      <span class="st">${d ? `<span class="cd">${l.code[0]}</span>${l.code[1]}` : (i === nextIdx ? '▶ GO' : '')}</span></button>`;
  }).join('')}</div>
  <div class="sec-h">📝 再模擬考（和真的考試一樣）</div>
  <button class="exam-card ${S.done[EXAM.id] ? 'done' : ''}" id="exam"><span class="tag">跟真的考試一模一樣</span><h2>📝 模擬考</h2><p>複誦 5 題・朗讀句子與短文・回答問題 7 題<br>共 18 題・約 10 分鐘・建議戴耳機</p><span class="go2">${S.done[EXAM.id] ? EXAM.code[0] + ' ' + EXAM.code[1] + '・再考一次' : '開始 ▶'}</span></button>
  <div class="foot">${ls.filter(l => S.done[l.id]).length}/${ls.length} 關練習完成${S.done[EXAM.id] ? '・模擬考 ✓' : ''}<br>良立文教 © ${new Date().getFullYear()}</div>`;
  $('#mus').onclick = toggleMusic;
  $('#uback').onclick = home;
  app.querySelectorAll('[data-l]').forEach(b => b.onclick = () => { musicOff(); lessonIntro(+b.dataset.l); });
  $('#exam').onclick = () => { musicOff(); examIntro(); };
  kickMusic();

// ═════════ 模擬考（照真實考試流程：自動進行、不能重播、不給提示） ═════════
const sleep = ms => new Promise(r => setTimeout(r, ms / (window.__fast || 1)));
let EX = null;   // 正在進行的考試
function zhVoice() { try { const v = speechSynthesis.getVoices(); return v.find(x => /zh[-_]TW/i.test(x.lang)) || v.find(x => /zh/i.test(x.lang)); } catch (e) { return null; } }
function speakZh(text) {
  return new Promise(res => {
    const v = zhVoice(); const est = 1500 + text.length * 230;
    if (!window.speechSynthesis || !v) return setTimeout(res, est);
    try {
      speechSynthesis.cancel();
      const u = new SpeechSynthesisUtterance(text); u.voice = v; u.lang = v.lang; u.rate = 1.05;
      let fin = false; const end = () => { if (!fin) { fin = true; res(); } };
      u.onend = end; u.onerror = end; setTimeout(end, est + 3000);
      speechSynthesis.speak(u);
    } catch (e) { setTimeout(res, est); }
  });
}

  app.innerHTML = `<div class="top"><button class="back" id="back">✕</button><div class="ttl">📝 模擬考<small>全民英檢初級複試・口說</small></div></div>

      loop();

function stopExamStream() { if (EX && EX.stream) EX.stream.getTracks().forEach(t => t.stop()); if (EX) EX.stop = true; }
const EX_TOTAL = 5 * 2 + 2 + 7 * 2 + 3;   // 進度條用的步數
function exScreen(part, step, inner) {
  app.innerHTML = `<div class="ex"><div class="ex-top"><span class="part">${part}</span><button class="back" id="quit">✕</button></div>
  <div class="ex-bar"><i style="width:${Math.round(step / EX_TOTAL * 100)}%"></i></div><div class="ex-main">${inner}</div></div>`;

    document.body.appendChild(m);

const clockSVG = (sec, cls) => `<div class="ex-clock"><svg viewBox="0 0 150 150"><circle cx="75" cy="75" r="66" stroke="#ecdcc0"/><circle id="clk" cx="75" cy="75" r="66" stroke="${cls === 'speak' ? '#ff5a36' : '#c9a24a'}" stroke-dasharray="415" stroke-dashoffset="0" stroke-linecap="round"/></svg><b id="clkn">${sec}</b></div>`;
async function countdown(sec) {
  const t0 = Date.now(), k = window.__fast || 1;
  while (true) {
    if (EX.stop) throw 'stop';
    const left = sec - (Date.now() - t0) * k / 1000;
    const c = $('#clk'), n = $('#clkn');
    if (c) c.style.strokeDashoffset = String(415 * (1 - Math.max(0, left) / sec));
    if (n) n.textContent = Math.max(0, Math.ceil(left));
    if (left <= 0) return;
    await sleep(100);
  }
}
async function playTwice(text) {
  if (EX.stop) throw 'stop';
  await speak(text, .9); if (EX.stop) throw 'stop';
  await sleep(1500);                          // 兩次之間約 1–2 秒
  await speak(text, .9); if (EX.stop) throw 'stop';
  await sleep(300);
}
async function recordFor(sec, key) {
  const ses = await startCapture(null, EX.stream);
  try { await countdown(sec); } finally { const r = await ses.stop(); EX.ans[key] = r; }
  chime(true);
}
async function instruction(part, step, key) {
  const [h, t] = EXAM.ins[key];
  exScreen(part, step, `<div class="ex-ins"><h3>${h}</h3>${t}</div><div class="sub">🔊 請聽說明</div>`);
  await speakZh(h + '。' + t); if (EX.stop) throw 'stop';
  await sleep(800);
}
async function runExam() {
  EX = EX || {}; EX.stop = false; EX.ans = {};
  if (!EX.stream) { try { EX.stream = await navigator.mediaDevices.getUserMedia({ audio: true }); } catch (e) {} }
  try { EX.lock = await navigator.wakeLock?.request('screen'); } catch (e) {}
  let step = 0;
  try {
    exScreen('口說測驗', step, `<div class="ex-state">🎧</div><div class="ex-ins" style="text-align:center">口說測驗現在開始</div>`);
    await speakZh('口說測驗現在開始。'); await sleep(600);
    // ── 第一部分 複誦 ──
    const P1 = '第一部分・複誦';
    await instruction(P1, ++step, 'p1');
    for (let i = 0; i < EXAM.repeat.length; i++) {
      const s = EXAM.repeat[i];
      exScreen(P1, ++step, `<div class="ex-no">第 ${i + 1} 題</div><div class="ex-state listen">🔊 聽</div><div class="wave">${'<i></i>'.repeat(9)}</div>`);
      animWave(true);
      await playTwice(s);
      animWave(false);
      const sec = Math.min(10, Math.max(5, Math.round(s.split(' ').length * .6 + 3)));
      exScreen(P1, ++step, `<div class="ex-no">第 ${i + 1} 題</div><div class="ex-state speak">🎤 請跟著念</div>${clockSVG(sec, 'speak')}`);
      await recordFor(sec, 'r' + i);
    }
    // ── 第二部分 朗讀句子與短文 ──
    const P2 = '第二部分・朗讀句子與短文';
    await instruction(P2, ++step, 'p2');
    const paper = `<div class="ex-paper"><ol>${EXAM.read.map(t => `<li>${esc(t)}</li>`).join('')}</ol>${esc(EXAM.passage)}</div>`;
    exScreen(P2, ++step, `<div class="ex-state prep">📖 準備 1 分鐘</div>${clockSVG(60, 'prep')}${paper}`);
    shrinkClock(); await countdown(60);
    exScreen(P2, ++step, `<div class="ex-state speak">🎤 請開始朗讀</div>${clockSVG(60, 'speak')}${paper}`);
    shrinkClock(); chime(true);
    await recordFor(60, 'read');
    // ── 第三部分 回答問題 ──
    const P3 = '第三部分・回答問題';
    await instruction(P3, ++step, 'p3');
    for (let i = 0; i < EXAM.answer.length; i++) {
      exScreen(P3, ++step, `<div class="ex-no">第 ${i + 1} 題</div><div class="ex-state listen">🔊 聽</div><div class="wave">${'<i></i>'.repeat(9)}</div>`);
      animWave(true);
      await playTwice(EXAM.answer[i].q);
      animWave(false);
      exScreen(P3, ++step, `<div class="ex-no">第 ${i + 1} 題</div><div class="ex-state speak">🎤 請回答</div>${clockSVG(15, 'speak')}`);
      await recordFor(15, 'a' + i);
    }
    exScreen('口說測驗', EX_TOTAL, `<div class="ex-state">🏁</div><div class="ex-ins" style="text-align:center">測驗結束，謝謝！</div>`);
    await speakZh('測驗結束，謝謝。');
  } catch (e) { animWave(false); if (e === 'stop') return; console.error(e); }
  try { EX.lock && EX.lock.release(); } catch (e) {}
  if (EX.stream) EX.stream.getTracks().forEach(t => t.stop());
  EX.stream = null;
  examResult();
}
let waveT = null;
function animWave(on) { clearInterval(waveT); if (on) waveT = setInterval(() => document.querySelectorAll('.wave i').forEach(i => i.style.height = (6 + Math.random() * 24) + 'px'), 120); }
function shrinkClock() { const c = document.querySelector('.ex-clock'); if (c) { c.style.width = c.style.height = '90px'; const sv = c.querySelector('svg'); sv.style.width = sv.style.height = '90px'; c.querySelector('b').style.fontSize = '26px'; } }
function examResult() {
  S.done[EXAM.id] = 1; save(); confetti();
  const A = EX.ans;
  const item = (n, text, r, ref) => `<div class="res-item"><span class="n">${n}</span><span class="t">${esc(text)}${r && r.text ? `<small>👂 App 聽到：${esc(r.text)}</small>` : ''}${ref ? `<small>💡 參考：${esc(ref)}</small>` : ''}</span>${r && r.url ? `<button class="pill" data-u="${r.url}" style="padding:7px 11px">🎧</button>` : ''}</div>`;
  app.innerHTML = `<div class="top"><button class="back" id="back">✕</button><div class="ttl">📝 模擬考完成！</div></div>
  <div class="card done"><div class="big" style="font-size:80px">${EXAM.code[0]}</div><div class="code">驗收圖案：${EXAM.code[1]}</div><p>📣 告訴爸媽或老師：「我拿到 <b>${EXAM.code[1]}</b>！」</p>${UPLOAD_URL ? `<div class="send" id="send">📤 正在交給老師…</div>` : ''}<p>下面可以聽自己每一題的錄音 👇</p></div>
  <div class="card"><h3 style="margin:0 0 4px">第一部分・複誦</h3>${EXAM.repeat.map((t, i) => item(i + 1, t, A['r' + i])).join('')}</div>
  <div class="card"><h3 style="margin:0 0 4px">第二部分・朗讀</h3>${item('📖', EXAM.read.join(' ') + ' ' + EXAM.passage, A.read)}</div>
  <div class="card"><h3 style="margin:0 0 4px">第三部分・回答問題</h3>${EXAM.answer.map((x, i) => item(i + 1, x.q, A['a' + i], x.ref)).join('')}</div>
  <div class="card rubric"><b>📋 真實考試怎麼評分（由老師評）</b><br>① 發音・語調・流暢度：看三個部分，0–5 級分<br>② 文法・字彙：看第三部分，0–5 級分<br>兩項相加 × 10 ＝ 100 分（例：(4+3)×10 = 70 分）</div>
  <div class="row"><button class="pill" id="again">🔁 再考一次</button><button class="pill go" id="home">回首頁 🏠</button></div>`;
  $('#back').onclick = unitHome; $('#home').onclick = unitHome; $('#again').onclick = examIntro;
  app.querySelectorAll('[data-u]').forEach(b => b.onclick = () => playUrl(b.dataset.u));
  if (UPLOAD_URL) uploadExam(A);
}
const blob64 = url => fetch(url).then(r => r.blob()).then(b => new Promise((res, rej) => { const f = new FileReader(); f.onload = () => res({ mime: b.type, data: String(f.result).split(',')[1] }); f.onerror = rej; f.readAsDataURL(b); }));
async function uploadExam(A) {
  const box = $('#send'); if (!box) return;
  box.className = 'send'; box.textContent = '📤 正在交給老師…（不要關掉喔）';
  try {
    const list = [...EXAM.repeat.map((t, i) => ['1-' + (i + 1) + ' 複誦', A['r' + i]]), ['2 朗讀', A.read], ...EXAM.answer.map((x, i) => ['3-' + (i + 1) + ' 回答', A['a' + i]])];
    const clips = [];
    for (const [label, r] of list) { const c = r && r.url ? await blob64(r.url) : {}; clips.push({ label, text: (r && r.text) || '', ...c }); }
    const res = await fetch(UPLOAD_URL, { method: 'POST', body: JSON.stringify({ key: UPLOAD_KEY, week: `第${WEEK.no}單元 ${WEEK.zh} ${WEEK.title}`, cls: S.cls || '', name: S.name || '', clips }) });
    const j = await res.json();
    if (!j.ok) throw new Error(j.err || 'fail');
    box.className = 'send ok'; box.textContent = '✅ 老師收到了！';
  } catch (e) {
    box.className = 'send bad'; box.innerHTML = '😢 沒有傳成功（網路不穩？）<br><button class="pill" id="resend" style="margin-top:8px">📤 再傳一次</button>';
    $('#resend').onclick = () => uploadExam(A);
  }
}

setUnit(S.unit || 1);
home();
</script>
